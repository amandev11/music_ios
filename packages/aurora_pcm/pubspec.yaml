name: aurora_pcm
description: Native AVFoundation audio decoder used by Automix beat analysis on iOS and macOS.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AuroraPcmPlugin
      macos:
        pluginClass: AuroraPcmPlugin
